services:
  - type: web
    name: restaurant-management-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Postgres is hosted on Neon rather than Render: Render's free Postgres
      # expires after 30 days. The connection string is a secret, so it is set
      # manually in the Render dashboard instead of being committed here.
      - key: DATABASE_URL
        sync: false
      # Groq's OpenAI-compatible endpoint (see README) — the key itself is
      # a secret and must be set manually in the Render dashboard, not
      # committed here.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
