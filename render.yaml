databases:
  - name: restaurant-management-db
    databaseName: restaurant
    user: restaurant
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: restaurant-management-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-management-db
          property: connectionString
      # Groq's OpenAI-compatible endpoint (see README) — the key itself is
      # a secret and must be set manually in the Render dashboard, not
      # committed here.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
