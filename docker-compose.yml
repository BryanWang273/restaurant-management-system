services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: restaurant
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    # OPENAI_API_KEY / OPENAI_BASE_URL / OPENAI_MODEL come from .env if
    # present; DATABASE_URL is overridden below to point at the `db`
    # service's hostname on the compose network rather than localhost.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:devpass@db:5432/restaurant
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
